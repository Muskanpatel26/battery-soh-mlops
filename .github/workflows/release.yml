name: Battery SOH CI and GitOps

on:
  workflow_dispatch:

  push:
    branches:
      - main

    paths:
      - "src/**"
      - "tests/**"
      - "bundle/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/release.yml"

permissions:
  contents: write
  packages: write

concurrency:
  group: battery-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test model and API
        run: python -m pytest -q

      - name: Generate image tag
        id: image
        shell: bash
        run: |
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          echo "tag=ghcr.io/${REPO_LOWER}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Update deployment image in Git
        env:
          IMAGE: ${{ steps.image.outputs.tag }}

        shell: bash

        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("k8s/deployment.yaml")

          updated, replacements = re.subn(
              r"(?m)^(\s*image:) .*$",
              lambda match: (
                  match.group(1)
                  + " "
                  + os.environ["IMAGE"]
              ),
              path.read_text()
          )

          assert replacements == 1

          path.write_text(updated)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if ! git diff --cached --quiet; then
            git commit -m "Deploy image ${GITHUB_SHA} [skip ci]"
            git push origin HEAD:main
          fi
