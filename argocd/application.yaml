apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: battery-soh
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Muskanpatel26/battery-soh-mlops.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: battery-mlops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
