apiVersion: apps/v1
kind: Deployment

metadata:
  name: battery-soh
  namespace: battery-mlops

spec:
  replicas: 1
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: battery-soh

  template:
    metadata:
      labels:
        app: battery-soh

    spec:
      containers:
        - name: api
          image: ghcr.io/muskanpatel26/battery-soh-mlops:bootstrap

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: 100m
              memory: 384Mi

            limits:
              cpu: "1"
              memory: 1Gi

          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15

---
apiVersion: v1
kind: Service

metadata:
  name: battery-soh
  namespace: battery-mlops

spec:
  type: ClusterIP

  selector:
    app: battery-soh

  ports:
    - port: 8000
      targetPort: 8000
